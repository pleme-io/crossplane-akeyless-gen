    - managed
    - akeyless
    kind: GatewayProducerVenafi
    plural: gatewayproducervenafis
    singular: gatewayproducervenafi
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              deletionPolicy:
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                properties:
                  admin_rotation_interval_days:
                    description: Admin credentials rotation interval (days)
                    format: int64
                    type: integer
                  allow_subdomains:
                    description: Allow subdomains
                    type: boolean
                  allowed_domains:
                    description: Allowed domains
                    items:
                      type: string
                    type: array
                  auto_generated_folder:
                    description: Auto generated folder
                    type: string
                  delete_protection:
                    description: Protection from accidental deletion of this object [true/false]
                    type: string
                  enable_admin_rotation:
                    description: Automatic admin credentials rotation
                    type: boolean
                  input_rule:
                    description: |-
                      Agentic input rule in name=...,rule=... format (e.g. name=rule1,rule=Sanitize input)
                      Mirrors commands.AgenticRulesParams — kept separate because ResourceDS
                      cannot embed it (different package, different struct layout).
                    items:
                      type: string
                    type: array
                  item_custom_fields:
                    additionalProperties:
                      type: string
                    description: Additional custom fields to associate with the item
                    type: object
                  name:
                    description: Dynamic secret name (immutable)
                    type: string
                  output_rule:
                    description: Agentic output rule in name=...,rule=... format (e.g. name=rule1,rule=Mask secrets)
                    items:
                      type: string
                    type: array
                  producer_encryption_key_name:
                    description: Dynamic producer encryption key
                    type: string
                  root_first_in_chain:
                    description: Root first in chain
                    type: boolean
                  sign_using_akeyless_pki:
                    description: Use Akeyless PKI issuer or Venafi issuer
                    type: boolean
                  signer_key_name:
                    description: Signer key name
                    type: string
                  store_private_key:
                    description: Store private key
                    type: boolean
                  tags:
                    description: Add tags attached to this object
                    items:
                      type: string
                    type: array
                  target_name:
                    description: Target name
                    type: string
                  user_ttl:
                    description: User TTL in time.Duration format (2160h / 129600m / etc...). When using sign-using-akeyless-pki certificates created will have this validity period, otherwise the user-ttl is taken from the Validity Period field of the Zone's' Issuing Template. When using cert-manager it is advised to have a TTL of above 60 days (1440h). For more information - https://cert-manager.io/docs/usage/certificate/
                    type: string
                  venafi_access_token:
                    description: Venafi Access Token to use to access the TPP environment (Relevant when using TPP)
                    type: string
                  venafi_api_key:
                    description: Venafi API key
                    type: string
                  venafi_baseurl:
                    description: Venafi Baseurl
                    type: string
                  venafi_client_id:
                    description: Venafi Client ID that was used when the access token was generated
                    type: string
                  venafi_refresh_token:
                    description: Venafi Refresh Token to use when the Access Token is expired (Relevant when using TPP)
                    type: string
                  venafi_use_tpp:
                    description: Venafi using TPP
                    type: boolean
                  venafi_zone:
                    description: Venafi Zone
                    type: string
                required:
                - name
                type: object
              managementPolicies:
                items:
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                properties:
                  name:
                    type: string
                  policy:
                    properties:
                      resolution:
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              publishConnectionDetailsTo:
                properties:
                  configRef:
                    properties:
                      name:
                        type: string
                    type: object
                  metadata:
                    type: object
                  name:
                    type: string
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  admin_rotation_interval_days:
                    description: Admin credentials rotation interval (days)
                    format: int64
                    type: integer
                  allow_subdomains:
                    description: Allow subdomains
                    type: boolean
                  allowed_domains:
                    description: Allowed domains
                    items:
                      type: string
                    type: array
                  auto_generated_folder:
                    description: Auto generated folder
                    type: string
                  delete_protection:
                    description: Protection from accidental deletion of this object [true/false]
                    type: string
                  enable_admin_rotation:
                    description: Automatic admin credentials rotation
                    type: boolean
                  input_rule:
                    description: |-
                      Agentic input rule in name=...,rule=... format (e.g. name=rule1,rule=Sanitize input)
                      Mirrors commands.AgenticRulesParams — kept separate because ResourceDS
                      cannot embed it (different package, different struct layout).
                    items:
                      type: string
                    type: array
                  item_custom_fields:
                    additionalProperties:
                      type: string
                    description: Additional custom fields to associate with the item
                    type: object
                  name:
                    description: Dynamic secret name
                    type: string
                  output_rule:
                    description: Agentic output rule in name=...,rule=... format (e.g. name=rule1,rule=Mask secrets)
                    items:
                      type: string
                    type: array
                  producer_encryption_key_name:
                    description: Dynamic producer encryption key
                    type: string
                  root_first_in_chain:
                    description: Root first in chain
                    type: boolean
                  sign_using_akeyless_pki:
                    description: Use Akeyless PKI issuer or Venafi issuer
                    type: boolean
                  signer_key_name:
                    description: Signer key name
                    type: string
                  store_private_key:
                    description: Store private key
                    type: boolean
                  tags:
                    description: Add tags attached to this object
                    items:
                      type: string
                    type: array
                  target_name:
                    description: Target name
                    type: string
                  user_ttl:
                    description: User TTL in time.Duration format (2160h / 129600m / etc...). When using sign-using-akeyless-pki certificates created will have this validity period, otherwise the user-ttl is taken from the Validity Period field of the Zone's' Issuing Template. When using cert-manager it is advised to have a TTL of above 60 days (1440h). For more information - https://cert-manager.io/docs/usage/certificate/
                    type: string
                  venafi_access_token:
                    description: Venafi Access Token to use to access the TPP environment (Relevant when using TPP)
                    type: string
                  venafi_api_key:
                    description: Venafi API key
                    type: string
                  venafi_baseurl:
                    description: Venafi Baseurl
                    type: string
                  venafi_client_id:
                    description: Venafi Client ID that was used when the access token was generated
                    type: string
                  venafi_refresh_token:
                    description: Venafi Refresh Token to use when the Access Token is expired (Relevant when using TPP)
                    type: string
                  venafi_use_tpp:
                    description: Venafi using TPP
                    type: boolean
                  venafi_zone:
                    description: Venafi Zone
                    type: string
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - type
                  - status
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
