                    type: string
                  tags:
                    description: Add tags attached to this object
                    items:
                      type: string
                    type: array
                  timeout_sec:
                    description: Maximum allowed time in seconds for the webhook to return the results
                    format: int64
                    type: integer
                  user_ttl:
                    description: User TTL
                    type: string
                required:
                - create_sync_url
                - name
                - revoke_sync_url
                type: object
              managementPolicies:
                items:
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                properties:
                  name:
                    type: string
                  policy:
                    properties:
                      resolution:
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              publishConnectionDetailsTo:
                properties:
                  configRef:
                    properties:
                      name:
                        type: string
                    type: object
                  metadata:
                    type: object
                  name:
                    type: string
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  admin_rotation_interval_days:
                    description: Define rotation interval in days
                    format: int64
                    type: integer
                  create_sync_url:
                    description: |-
                      URL of an endpoint that implements /sync/create method, for example
