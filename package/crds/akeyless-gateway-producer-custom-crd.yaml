                      Agentic input rule in name=...,rule=... format (e.g. name=rule1,rule=Sanitize input)
                      Mirrors commands.AgenticRulesParams — kept separate because ResourceDS
                      cannot embed it (different package, different struct layout).
                    items:
                      type: string
                    type: array
                  item_custom_fields:
                    additionalProperties:
                      type: string
                    description: Additional custom fields to associate with the item
                    type: object
                  name:
                    description: Dynamic secret name
                    type: string
                  output_rule:
                    description: Agentic output rule in name=...,rule=... format (e.g. name=rule1,rule=Mask secrets)
                    items:
                      type: string
                    type: array
                  payload:
                    description: Secret payload to be sent with each create/revoke webhook request
                    type: string
                  producer_encryption_key_name:
                    description: Dynamic producer encryption key
                    type: string
                  revoke_sync_url:
                    description: |-
                      URL of an endpoint that implements /sync/revoke method, for example
                      https://webhook.example.com/sync/revoke
                    type: string
                  rotate_sync_url:
                    description: |-
                      URL of an endpoint that implements /sync/rotate method, for example
                      https://webhook.example.com/sync/rotate
                    type: string
                  tags:
                    description: Add tags attached to this object
                    items:
                      type: string
                    type: array
                  timeout_sec:
                    description: Maximum allowed time in seconds for the webhook to return the results
                    format: int64
                    type: integer
                  user_ttl:
                    description: User TTL
                    type: string
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - type
                  - status
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
